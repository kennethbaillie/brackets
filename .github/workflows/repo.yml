name: Collate tasks by person

on:
  push:
    branches:
      - main

jobs:
  collate-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Clone brackets
        run: |
          git clone https://github.com/baillielab/brackets.git

      - name: Check if last commit was made by github-actions[bot]
        run: |
          LAST_COMMITTER=$(git log -1 --pretty=format:'%an')
          if [ "$LAST_COMMITTER" = "github-actions[bot]" ]; then
            echo "Action triggered by GitHub Actions bot. Exiting to avoid loop."
            exit 0
          fi

      - name: Run brackets Python script
        run: |
          python3 brackets/_extensions/brackets/brackets.py .

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Automated update: collated tasks" || echo "No changes to commit"
          git push origin main
